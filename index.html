
<!DOCTYPE html>
<html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Field Reporter</title>
  <!-- Tailwind CSS for modern mobile-first styling -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <!-- Open-source jsPDF library for database-free PDF generation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  
</head> <body class="bg-gray-100 font-sans p-4 min-h-screen flex flex-col justify-between">
  <!-- Mobile App Container -->
  <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6 w-full"> 
    <h1 class="text-2xl font-bold text-gray-800 mb-6 border-b pb-2 flex items-center gap-2"> 📋 Field Report Generator </h1> 
    <form id="reportForm" class="space-y-4"> <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Project / Location Name</label>
      <input type="text" id="projName" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="e.g. Site Alpha"> </div> 
      <div> <label class="block text-sm font-medium text-gray-700 mb-1">Inspector Name</label>
        <input type="text" id="inspector" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="John Doe"> </div>
      <div> <label class="block text-sm font-medium text-gray-700 mb-1">Field Observations & Notes</label>
        <textarea id="notes" rows="4" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Describe site conditions..."></textarea> </div>
      <button type="button" onclick="generatePDF()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg shadow transition duration-200 mt-6 flex justify-center items-center gap-2"> 🖨️ Export & Print PDF </button> </form> </div>
  <!-- Footnote reinforcing data privacy --> 
  <p class="text-center text-xs text-gray-400 mt-4">Data is processed entirely on-device. No information is stored or transmitted.</p> 
  
  <!-- PDF Generation Logic --> 
<script>
    async function generatePDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();

        // 1. Get form values
        const projName = document.getElementById('projName').value || 'N/A';
        const inspector = document.getElementById('inspector').value || 'N/A';
        const notes = document.getElementById('notes').value || 'No notes provided.';
        const date = new Date().toLocaleDateString();

        // 2. Structure the PDF Template Layout
        doc.setFillColor(30, 41, 59); // Dark blue header block
        doc.rect(0, 0, 210, 30, 'F');
        
        doc.setTextColor(255, 255, 255);
        doc.setFont("helvetica", "bold");
        doc.setFontSize(18);
        doc.text("OFFICIAL FIELD INSPECTION REPORT", 15, 20);

        // Metadata Grid
        doc.setTextColor(50, 50, 50);
        doc.setFontSize(11);
        doc.setFont("helvetica", "bold");
        doc.text("Date:", 15, 45);
        doc.setFont("helvetica", "normal");
        doc.text(date, 50, 45);

        doc.setFont("helvetica", "bold");
        doc.text("Project/Site:", 15, 55);
        doc.setFont("helvetica", "normal");
        doc.text(projName, 50, 55);

        doc.setFont("helvetica", "bold");
        doc.text("Inspector:", 15, 65);
        doc.setFont("helvetica", "normal");
        doc.text(inspector, 50, 65);

        // Divider Line
        doc.setDrawColor(200, 200, 200);
        doc.line(15, 75, 195, 75);

        // Section: Notes
        doc.setFont("helvetica", "bold");
        doc.setFontSize(13);
        doc.text("Field Observations:", 15, 85);

        doc.setFont("helvetica", "normal");
        doc.setFontSize(11);
        const splitNotes = doc.splitTextToSize(notes, 180);
        doc.text(splitNotes, 15, 95);

        // 3. MOBILE FIXED EXPORT ENGINE
        // Convert the raw data stream directly into a local binary object
        const pdfBlob = doc.output('blob');
        const blobUrl = URL.createObjectURL(pdfBlob);

        // Force mobile Chrome to cleanly handle the PDF natively in a fresh view pane
        window.open(blobUrl, '_blank');
    }
</script>
</body> </html>
